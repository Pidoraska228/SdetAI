name: SdetAI Cloud Training

on:
  push:
    branches: [ main ]

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Build C++ Core
        run: |
          mkdir build && cd build
          cmake .. && make

      - name: Run Training
        run: |
          if [ -f "./build/bin/sdetai_train" ]; then
            ./build/bin/sdetai_train
          elif [ -f "./build/sdetai_train" ]; then
            ./build/sdetai_train
          else
            find . -name "sdetai_train" -exec {} \;
          fi

      - name: Commit and Push Updated Vocab/Weights
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
      - name: Commit and Push Updated Vocab/Weights
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "SdetAI-Trainer-Bot"
          git config --global user.email "bot@sdetai.local"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add data/vocab.bin
          git commit -m "🤖 [Bot] Авто-обновление словаря после обучения" || echo "No changes to commit"
          git push