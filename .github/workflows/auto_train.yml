name: SdetAI Cloud Training

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    # Не даём GitHub ждать бесконечно.
    # 350 минут = 5ч 50м, немного меньше лимита.
    timeout-minutes: 350

    permissions:
      contents: write

    steps:

      # ==========================================================
      # 1. Получаем репозиторий
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. Установка зависимостей
      # ==========================================================

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libcurl4-openssl-dev

      # ==========================================================
      # 3. Показываем состояние checkpoint
      # ==========================================================

      - name: Check training checkpoint
        run: |
          echo "========================================"
          echo "       SdetAI CHECKPOINT"
          echo "========================================"

          if [ -f "data/weights.bin" ]; then
            echo "weights.bin найден."
            ls -lh data/weights.bin
          else
            echo "weights.bin НЕ найден."
            echo "Это будет первое обучение."
          fi

          if [ -f "data/vocab.bin" ]; then
            echo "vocab.bin найден."
            ls -lh data/vocab.bin
          else
            echo "vocab.bin НЕ найден."
          fi

          echo "========================================"

      # ==========================================================
      # 4. Сборка
      # ==========================================================

      - name: Build SdetAI
        run: |
          rm -rf build

          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build \
            --config Release \
            --parallel 2

      # ==========================================================
      # 5. Поиск train executable
      # ==========================================================

      - name: Find training executable
        run: |
          echo "Поиск sdetai_train..."

          find build -type f \
            \( -name "sdetai_train" -o -name "sdetai_train.exe" \) \
            -print

      # ==========================================================
      # 6. ОБУЧЕНИЕ
      #
      # ВАЖНО:
      # программа должна читать SDETAI_EPOCHS
      # и загружать data/weights.bin перед обучением.
      # ==========================================================

      - name: Run SdetAI Training
        env:
          SDETAI_EPOCHS: "2"
          SDETAI_LEARNING_RATE: "0.0005"
          SDETAI_RESUME: "1"
          SDETAI_CHECKPOINT: "data/weights.bin"
        run: |

          set -e

          echo "========================================"
          echo "       SdetAI TRAINING"
          echo "========================================"

          echo "Эпох за запуск: $SDETAI_EPOCHS"
          echo "Learning rate:  $SDETAI_LEARNING_RATE"
          echo "Resume:         $SDETAI_RESUME"
          echo "Checkpoint:     $SDETAI_CHECKPOINT"

          echo "========================================"

          if [ -f "./build/sdetai_train" ]; then

            ./build/sdetai_train

          elif [ -f "./build/bin/sdetai_train" ]; then

            ./build/bin/sdetai_train

          elif [ -f "./build/Release/sdetai_train" ]; then

            ./build/Release/sdetai_train

          else

            echo "ОШИБКА: sdetai_train не найден!"
            find build -type f -maxdepth 5
            exit 1

          fi

      # ==========================================================
      # 7. Проверяем, сохранились ли веса
      # ==========================================================

      - name: Check generated files
        if: always()
        run: |
          echo "========================================"
          echo "       GENERATED FILES"
          echo "========================================"

          if [ -f "data/weights.bin" ]; then
            echo "weights.bin:"
            ls -lh data/weights.bin
          else
            echo "WARNING: data/weights.bin отсутствует!"
          fi

          if [ -f "data/vocab.bin" ]; then
            echo "vocab.bin:"
            ls -lh data/vocab.bin
          fi

          echo "========================================"

      # ==========================================================
      # 8. Сохраняем checkpoint как GitHub Artifact
      # ==========================================================

      - name: Upload training checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdetai-training-checkpoint
          path: |
            data/weights.bin
            data/vocab.bin
          if-no-files-found: warn
          retention-days: 7

      # ==========================================================
      # 9. Коммитим веса
      # ==========================================================

      - name: Commit trained files
        if: success()
        run: |

          git config user.name "SdetAI Training Bot"
          git config user.email "actions@github.com"

          git add data/weights.bin
          git add data/vocab.bin

          if git diff --cached --quiet; then
            echo "Новых изменений для commit нет."
          else

            git commit \
              -m "🤖 SdetAI checkpoint: 2 epochs"

            git push origin main

          fi