name: SdetAI Cloud Training

on:
  push:
    branches: [ main ]

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Build C++ Core
        run: |
          mkdir build && cd build
          cmake .. && make

      - name: Run Training
        run: |
          if [ -f "./build/bin/sdetai_train" ]; then
            ./build/bin/sdetai_train
          elif [ -f "./build/sdetai_train" ]; then
            ./build/sdetai_train
          else
            find . -name "sdetai_train" -exec {} \;
          fi

      - name: Commit and Push Updated Vocab/Weights
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
      - name: Commit and Push Updated Vocab/Weights
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
      - name: Commit and Push Updated Vocab/Weights
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 [Bot] Авто-обновление словаря после обучения в облаке"
          file_pattern: "data/vocab.bin"