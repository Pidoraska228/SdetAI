name: SdetAI Cloud Training

on:
  push:
    branches:
      - main

  workflow_dispatch:

  # БЫЛО: тут ещё стоял schedule (раз в 6 часов) как способ продолжать
  # обучение само по себе. Теперь для этого есть отдельный, более
  # точный механизм — шаг "Trigger next training run" в конце job'а,
  # который сам запускает следующий прогон сразу после окончания
  # текущего. Два независимых триггера (schedule + self-trigger) могли
  # наложиться друг на друга по времени, и тогда ДВА job'а одновременно
  # пытались закоммитить/запушить в main — один из них получал
  # "rejected (fetch first)", и весь прогресс той эпохи терялся
  # (именно это произошло: эпоха 28 не долетела до git, следующий run
  # начал её заново). concurrency ниже — жёсткая защита от этого на
  # будущее, но schedule всё равно убираю, раз он больше не нужен и
  # был реальным источником проблемы.

# Гарантия от GitHub: НИКОГДА не запускать два job'а этого workflow
# одновременно — новый запуск встаёт в очередь и ждёт, пока текущий
# не закончится, вместо того чтобы работать параллельно и конфликтовать
# при коммите/пуше.
concurrency:
  group: sdetai-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest

    # Не даём GitHub ждать бесконечно.
    # 350 минут = 5ч 50м, немного меньше лимита.
    timeout-minutes: 350

    permissions:
      contents: write
      actions: write

    steps:

      # ==========================================================
      # 1. Получаем репозиторий
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. Установка зависимостей
      # ==========================================================

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libcurl4-openssl-dev

      # ==========================================================
      # 3. Показываем состояние checkpoint
      # ==========================================================

      - name: Check training checkpoint
        run: |
          echo "========================================"
          echo "       SdetAI CHECKPOINT"
          echo "========================================"

          if [ -f "data/weights.bin" ]; then
            echo "weights.bin найден."
            ls -lh data/weights.bin
          else
            echo "weights.bin НЕ найден."
            echo "Это будет первое обучение."
          fi

          if [ -f "data/vocab.bin" ]; then
            echo "vocab.bin найден."
            ls -lh data/vocab.bin
          else
            echo "vocab.bin НЕ найден."
          fi

          echo "========================================"

      # ==========================================================
      # 4. Сборка
      # ==========================================================

      - name: Build SdetAI
        run: |
          rm -rf build

          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build build \
            --config Release \
            --parallel 2

      # ==========================================================
      # 5. Поиск train executable
      # ==========================================================

      - name: Find training executable
        run: |
          echo "Поиск sdetai_train..."

          find build -type f \
            \( -name "sdetai_train" -o -name "sdetai_train.exe" \) \
            -print

      # ==========================================================
      # 6. ОБУЧЕНИЕ
      #
      # ВАЖНО:
      # программа должна читать SDETAI_EPOCHS
      # и загружать data/weights.bin перед обучением.
      # ==========================================================

      - name: Run SdetAI Training
        id: run_training
        env:
          # ВАЖНО: раньше тут стояло SDETAI_EPOCHS (без _PER_RUN) — код
          # в train_main.cpp читает именно SDETAI_EPOCHS_PER_RUN, так
          # что старая переменная никогда реально не читалась (случайно
          # совпадало со значением по умолчанию). Теперь реальным
          # ограничителем служит бюджет времени ниже — ставим высокий
          # потолок по эпохам, чтобы он не мешал.
          SDETAI_EPOCHS_PER_RUN: "99"
          SDETAI_TIME_BUDGET_MINUTES: "320"
          SDETAI_LEARNING_RATE: "0.0005"
          SDETAI_RESUME: "1"
          SDETAI_CHECKPOINT: "data/weights.bin"
          OMP_NUM_THREADS: "4"
        run: |

          set -e
          set -o pipefail

          echo "========================================"
          echo "       SdetAI TRAINING"
          echo "========================================"

          echo "Бюджет времени: $SDETAI_TIME_BUDGET_MINUTES мин"
          echo "Learning rate:  $SDETAI_LEARNING_RATE"
          echo "Resume:         $SDETAI_RESUME"
          echo "Checkpoint:     $SDETAI_CHECKPOINT"

          echo "========================================"

          # Пишем в лог-файл (и одновременно в консоль через tee),
          # чтобы следующий шаг мог найти в нём метку завершения
          # обучения (SDETAI_TRAINING_COMPLETE), не разбирая бинарный
          # weights.bin.
          if [ -f "./build/sdetai_train" ]; then

            ./build/sdetai_train 2>&1 | tee training.log

          elif [ -f "./build/bin/sdetai_train" ]; then

            ./build/bin/sdetai_train 2>&1 | tee training.log

          elif [ -f "./build/Release/sdetai_train" ]; then

            ./build/Release/sdetai_train 2>&1 | tee training.log

          else

            echo "ОШИБКА: sdetai_train не найден!"
            find build -type f -maxdepth 5
            exit 1

          fi

      # ==========================================================
      # 7. Проверяем, сохранились ли веса
      # ==========================================================

      - name: Check generated files
        if: always()
        run: |
          echo "========================================"
          echo "       GENERATED FILES"
          echo "========================================"

          if [ -f "data/weights.bin" ]; then
            echo "weights.bin:"
            ls -lh data/weights.bin
          else
            echo "WARNING: data/weights.bin отсутствует!"
          fi

          if [ -f "data/vocab.bin" ]; then
            echo "vocab.bin:"
            ls -lh data/vocab.bin
          fi

          echo "========================================"

      # ==========================================================
      # 8. Сохраняем checkpoint как GitHub Artifact
      # ==========================================================

      - name: Upload training checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdetai-training-checkpoint
          path: |
            data/weights.bin
            data/vocab.bin
          if-no-files-found: warn
          retention-days: 7

      # ==========================================================
      # 9. Коммитим веса
      #
      # БЫЛО: if: success() — при отмене job'а по timeout-minutes
      # (что и происходит почти каждый раз, т.к. одна эпоха не
      # укладывается в лимит) статус шага "Run SdetAI Training"
      # становится cancelled, а НЕ success — и этот шаг пропускался
      # целиком, несмотря на то что data/weights.bin на диске уже
      # обновлён промежуточным чекпоинтом (каждые 20,000 токенов) и
      # даже загружен как artifact шагом выше. Прогресс терялся не
      # физически, а просто не долетал до git.
      #
      # СТАЛО: always() — коммитим, что бы ни случилось с шагом
      # обучения (success/failure/cancelled), лишь бы файл реально
      # существовал и в нём есть изменения.
      # ==========================================================

      - name: Commit trained files
        if: always()
        run: |

          git config user.name "SdetAI Training Bot"
          git config user.email "actions@github.com"

          if [ ! -f "data/weights.bin" ]; then
            echo "data/weights.bin отсутствует — коммитить нечего."
            exit 0
          fi

          git add data/weights.bin
          git add data/vocab.bin

          if git diff --cached --quiet; then
            echo "Новых изменений для commit нет."
            exit 0
          fi

          git commit -m "🤖 SdetAI checkpoint (автообучение)"

          # concurrency-группа выше уже не даёт запускать два таких
          # job'а параллельно, но на всякий случай (например, если кто-то
          # запушит что-то руками в этот момент) — несколько попыток с
          # rebase, чтобы НЕ терять чекпоинт эпохи из-за гонки push'а,
          # как это произошло раньше (эпоха 28 потерялась именно так).
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Push успешен (попытка $attempt)."
              exit 0
            fi
            echo "Push не прошёл (попытка $attempt) — подтягиваю изменения и пробую снова..."
            git pull --rebase origin main
          done

          echo "ОШИБКА: push не удался после нескольких попыток — чекпоинт этой эпохи НЕ сохранён в git!"
          exit 1

      # ==========================================================
      # 10. Самозапуск следующего прогона
      #
      # Обучение останавливается либо по бюджету времени (аккуратно,
      # см. SDETAI_TIME_BUDGET_MINUTES), либо доходит до конца текущей
      # эпохи и всё ещё не достигает 50/50 — в обоих случаях нужно
      # продолжение. Раньше для этого был только schedule (раз в 6ч,
      # с простоями и рассинхроном с реальным временем выполнения).
      # Теперь job сам немедленно запускает следующий, как только
      # заканчивает текущий — цепочка идёт без пауз до тех пор, пока
      # training.cpp не напечатает SDETAI_TRAINING_COMPLETE (все 50
      # эпох пройдены), тогда цепочка сама останавливается.
      #
      # gh CLI уже установлен на ubuntu-latest, GITHUB_TOKEN даёт
      # право на repo (actions: write выставлен в permissions выше).
      # ==========================================================

      - name: Trigger next training run
        if: always() && steps.run_training.outcome == 'success'
        env:
          # ВАЖНО: встроенный GITHUB_TOKEN (${{ github.token }}) не
          # может запускать новые workflow runs — это защита GitHub от
          # бесконечных циклов, и её нельзя обойти даже выдав
          # permissions: actions: write. Именно поэтому предыдущая
          # попытка молча ничего не делала. Нужен personal access
          # token, добавленный как secret WORKFLOW_TRIGGER_TOKEN.
          GH_TOKEN: ${{ secrets.WORKFLOW_TRIGGER_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ОШИБКА: secret WORKFLOW_TRIGGER_TOKEN не задан в репозитории — самозапуск невозможен."
            exit 1
          fi

          if [ -f training.log ] && grep -q "SDETAI_TRAINING_COMPLETE" training.log; then
            echo "Обучение полностью завершено (50/50 эпох) — новый запуск не нужен."
          else
            echo "Обучение ещё не завершено — запускаю продолжение..."
            gh workflow run auto_train.yml --ref main
            echo "Запрос на новый run отправлен."
          fi
